name: iOS Simulator Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ios-simulator-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Xcode 26.2 tests
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify toolchain and simulator
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available

      # The shared scheme includes both unit and native UI-test targets. Keeping one
      # destination and serial execution also makes relaunch persistence deterministic.
      # Set the device appearance itself: app launch defaults are overridden when
      # the mode shell returns from its light chrome to the reader's system theme.
      - name: Run simulator tests serially
        run: |
          set -euo pipefail
          test_simulator=$(xcrun simctl list devices available --json | jq -er '
            .devices["com.apple.CoreSimulator.SimRuntime.iOS-26-2"]
            | map(select(.name == "iPhone 17 Pro")) | .[0].udid')
          xcrun simctl bootstatus "$test_simulator" -b
          xcrun simctl ui "$test_simulator" appearance dark
          xcodebuild test \
            -project ConvoLab.xcodeproj \
            -scheme ConvoLab \
            -destination "platform=iOS Simulator,id=$test_simulator" \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
